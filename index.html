<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<meta name="robots" content="noindex, nofollow" />
	<meta name="color-scheme" content="light" />

	<title>RIC Events</title>

	<style>
		:root {
			--navy: #0b1f3a;
			--navy-light: #17365f;
			--yellow: #f5c400;
			--white: #ffffff;
			--background: #f4f6f8;
			--text: #20252b;
			--muted: #66717d;
			--border: #d8dee5;
		}

		* {
			box-sizing: border-box;
		}

		html, body {
			margin: 0;
			padding: 0;
		}

		body {
			background: var(--background);
			color: var(--text);
			font-family: Arial, Helvetica, sans-serif;
			line-height: 1.5;
		}

		.container {
			max-width: 1100px;
			margin: 0 auto;
			padding: 24px 16px 40px;
		}

		.header {
			margin-bottom: 16px;
		}

		.header h1 {
			margin: 0;
			color: var(--navy);
			font-size: 1.4rem;
		}

		.events-grid {
			display: grid;
			grid-template-columns: 1fr;
			gap: 20px;
		}

		.month-heading {
			margin: 0;
			padding-bottom: 8px;
			border-bottom: 3px solid var(--yellow);
			color: var(--navy);
			font-size: 1.1rem;
			text-transform: uppercase;
			letter-spacing: 0.04em;
		}

		.month-heading:not(:first-child) {
			margin-top: 12px;
		}

		.event-card {
			display: flex;
			flex-direction: row;
			background: var(--white);
			border: 1px solid var(--border);
			border-radius: 12px;
			overflow: hidden;
			box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
		}

		.event-image-wrap {
			position: relative;
			display: flex;
			flex: 0 0 280px;
			align-items: center;
			justify-content: center;
			background: #e9edf1;
			min-height: 200px;
			overflow: hidden;
		}

		.flyer-trigger {
			display: flex;
			align-items: center;
			justify-content: center;
			width: 100%;
			height: 100%;
			padding: 0;
			border: none;
			background: none;
			cursor: zoom-in;
		}

		.flyer-trigger:focus-visible {
			outline: 3px solid var(--yellow);
			outline-offset: -3px;
		}

		.flyer-zoom-hint {
			position: absolute;
			bottom: 8px;
			right: 8px;
			display: flex;
			align-items: center;
			justify-content: center;
			width: 28px;
			height: 28px;
			border-radius: 50%;
			background: rgba(11, 31, 58, 0.75);
			color: var(--yellow);
			font-size: 0.95rem;
			pointer-events: none;
		}

		.event-image {
			display: block;
			width: 100%;
			height: 100%;
			object-fit: contain;
		}

		.event-content {
			display: flex;
			flex-direction: column;
			flex: 1;
			min-width: 0;
			padding: 20px;
		}

		.event-title {
			margin: 0 0 14px;
			color: var(--navy);
			font-size: 1.4rem;
			line-height: 1.25;
		}

		.event-details {
			margin: 0 0 16px;
			padding: 0;
			list-style: none;
		}

		.event-details li {
			margin-bottom: 7px;
		}

		.event-details strong {
			color: var(--navy);
		}

		.event-description {
			margin: 0 0 18px;
		}

		.event-button {
			display: inline-block;
			align-self: flex-start;
			margin-top: auto;
			padding: 10px 18px;
			background: var(--navy);
			color: var(--white);
			text-decoration: none;
			border-radius: 6px;
			font-weight: bold;
		}

		.event-button:hover,
		.event-button:focus-visible {
			background: var(--navy-light);
		}

		.event-button::after {
			content: " →";
		}

		.visually-hidden {
			position: absolute;
			width: 1px;
			height: 1px;
			padding: 0;
			margin: -1px;
			overflow: hidden;
			clip: rect(0, 0, 0, 0);
			white-space: nowrap;
			border: 0;
		}

		a:focus-visible,
		.event-button:focus-visible {
			outline: 3px solid var(--yellow);
			outline-offset: 2px;
		}

		.no-events {
			background: var(--white);
			border: 1px solid var(--border);
			border-left: 6px solid var(--yellow);
			border-radius: 8px;
			padding: 24px;
		}

		.no-events h2 {
			margin: 0 0 6px;
			color: var(--navy);
			font-size: 1.3rem;
		}

		.no-events p {
			margin: 0;
			color: var(--muted);
		}

		.load-error {
			background: var(--white);
			border: 1px solid var(--border);
			border-left: 6px solid #c0392b;
			border-radius: 8px;
			padding: 24px;
		}

		.load-error h2 {
			margin: 0 0 6px;
			color: #c0392b;
			font-size: 1.2rem;
		}

		.load-error p {
			margin: 0;
			color: var(--muted);
		}

		.noscript-message {
			max-width: 1100px;
			margin: 24px auto;
			padding: 16px;
			background: var(--white);
			border: 1px solid var(--border);
			border-left: 6px solid var(--yellow);
			border-radius: 8px;
		}

		.lightbox-overlay {
			position: fixed;
			inset: 0;
			display: flex;
			align-items: center;
			justify-content: center;
			padding: 24px;
			background: rgba(11, 31, 58, 0.85);
			z-index: 1000;
		}

		.lightbox-overlay[hidden] {
			display: none;
		}

		.lightbox-content {
			position: relative;
			max-width: 100%;
			max-height: 100%;
		}

		.lightbox-image {
			display: block;
			max-width: 100%;
			max-height: 90vh;
			border-radius: 8px;
			box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
		}

		.lightbox-close {
			position: absolute;
			top: -14px;
			right: -14px;
			width: 36px;
			height: 36px;
			display: flex;
			align-items: center;
			justify-content: center;
			border: none;
			border-radius: 50%;
			background: var(--yellow);
			color: var(--navy);
			font-size: 1.1rem;
			font-weight: bold;
			line-height: 1;
			cursor: pointer;
		}

		.lightbox-close:hover,
		.lightbox-close:focus-visible {
			background: var(--navy);
			color: var(--white);
			outline: 3px solid var(--yellow);
			outline-offset: 2px;
		}

		@media (max-width: 600px) {
			.event-card {
				flex-direction: column;
			}

			.event-image-wrap {
				flex: none;
				width: 100%;
				max-height: 240px;
			}
		}
	</style>
</head>

<body>

	<noscript>
		<div class="noscript-message">
			This page requires JavaScript to display current events. Please
			enable JavaScript, or check the Research &amp; Innovation Center
			calendar directly for current activities.
		</div>
	</noscript>

	<main class="container">

		<div class="header">
			<h1>Upcoming Events</h1>
		</div>

		<div id="events" class="events-grid" hidden></div>

		<div id="no-events" class="no-events" hidden>
			<h2>No featured events scheduled</h2>
			<p>
				Check the Research &amp; Innovation Center calendar for current
				room reservations, activities, and upcoming opportunities.
			</p>
		</div>

		<div id="load-error" class="load-error" hidden>
			<h2>Unable to load events</h2>
			<p>
				There may be a formatting error in events.js. Check the file for
				a missing comma, quote, or bracket.
			</p>
		</div>

	</main>

	<div id="lightbox" class="lightbox-overlay" role="dialog" aria-modal="true" aria-label="Enlarged event flyer" hidden>
		<div class="lightbox-content">
			<button type="button" id="lightbox-close" class="lightbox-close" aria-label="Close enlarged flyer">✕</button>
			<img id="lightbox-image" class="lightbox-image" src="" alt="">
		</div>
	</div>

	<script src="events.js"></script>

	<script>
		(function () {
			const eventsContainer = document.getElementById("events");
			const noEventsMessage = document.getElementById("no-events");
			const loadErrorMessage = document.getElementById("load-error");

			const lightbox = document.getElementById("lightbox");
			const lightboxImage = document.getElementById("lightbox-image");
			const lightboxClose = document.getElementById("lightbox-close");
			let lightboxTrigger = null;

			function handleLightboxKeydown(event) {
				if (event.key === "Escape") {
					closeLightbox();
				}
			}

			// Making <main> inert while the lightbox is open both prevents
			// Tab from reaching content behind the overlay (no separate
			// focus-trap logic needed, since the close button is the only
			// focusable element left) and hides that background content
			// from screen readers, which is what aria-modal="true" implies.
			const mainContent = document.querySelector("main");

			function openLightbox(src, alt, triggerEl) {
				lightboxTrigger = triggerEl;
				lightboxImage.src = src;
				lightboxImage.alt = alt;
				lightbox.hidden = false;
				mainContent.inert = true;
				lightboxClose.focus();
				document.addEventListener("keydown", handleLightboxKeydown);
			}

			function closeLightbox() {
				lightbox.hidden = true;
				lightboxImage.src = "";
				mainContent.inert = false;
				document.removeEventListener("keydown", handleLightboxKeydown);

				if (lightboxTrigger) {
					lightboxTrigger.focus();
				}
			}

			lightboxClose.addEventListener("click", closeLightbox);

			lightbox.addEventListener("click", event => {
				if (event.target === lightbox) {
					closeLightbox();
				}
			});

			// Base URL for a MyWorkshops course-code search. Used to build a
			// registration link automatically from an event's "course" field
			// when no explicit "link" is given.
			const MYWORKSHOPS_SEARCH_URL =
				"https://myworkshops.lonestar.edu/psc/elmprd/EMPLOYEE/ELM/c/LM_OD_EMPLOYEE_FL.LM_FND_LRN_FL.GBL?Page=LM_FND_LRN_RSLT_FL&Action=U&KWRD=";

			function getRegistrationLink(event) {
				if (event.link) {
					return event.link;
				}

				if (event.course) {
					return MYWORKSHOPS_SEARCH_URL + encodeURIComponent(event.course);
				}

				return null;
			}

			// Parses a "YYYY-MM-DD" string as a local calendar date instead of
			// UTC, so an event never disappears a day early for users west of
			// UTC (new Date("YYYY-MM-DD") parses as UTC midnight).
			function parseLocalDate(dateString) {
				const parts = String(dateString).split("-").map(Number);
				const [year, month, day] = parts;

				if (
					parts.length !== 3 ||
					!Number.isFinite(year) ||
					!Number.isFinite(month) ||
					!Number.isFinite(day)
				) {
					throw new Error(`Invalid date: "${dateString}". Use the format YYYY-MM-DD.`);
				}

				return new Date(year, month - 1, day);
			}

			function getToday() {
				const now = new Date();
				return new Date(now.getFullYear(), now.getMonth(), now.getDate());
			}

			function formatDisplayDate(date) {
				return date.toLocaleDateString("en-US", {
					weekday: "long",
					month: "long",
					day: "numeric",
					year: "numeric"
				});
			}

			// Small helper for building the card DOM without ever passing
			// event content through innerHTML, so a stray quote or angle
			// bracket in a title/description/link can't break the markup.
			function el(tag, options = {}) {
				const node = document.createElement(tag);

				if (options.className) {
					node.className = options.className;
				}

				if (options.text !== undefined) {
					node.textContent = options.text;
				}

				if (options.attrs) {
					for (const [name, value] of Object.entries(options.attrs)) {
						node.setAttribute(name, value);
					}
				}

				return node;
			}

			function buildDetailItem(label, value) {
				const item = el("li");
				const strong = el("strong", { text: `${label}:` });
				item.appendChild(strong);
				item.appendChild(document.createTextNode(` ${value}`));
				return item;
			}

			function buildEventCard(event) {
				const card = el("article", { className: "event-card" });

				if (event.image) {
					const imageWrap = el("div", { className: "event-image-wrap" });
					const trigger = el("button", {
						className: "flyer-trigger",
						attrs: {
							type: "button",
							"aria-label": `View larger flyer for ${event.title}`
						}
					});
					const image = el("img", {
						className: "event-image",
						attrs: {
							src: event.image,
							alt: "",
							loading: "lazy"
						}
					});

					trigger.appendChild(image);
					trigger.addEventListener("click", () => {
						openLightbox(event.image, event.imageAlt || event.title, trigger);
					});

					imageWrap.appendChild(trigger);
					imageWrap.appendChild(el("span", { className: "flyer-zoom-hint", text: "🔍", attrs: { "aria-hidden": "true" } }));
					card.appendChild(imageWrap);
				}

				const content = el("div", { className: "event-content" });

				content.appendChild(el("h3", { className: "event-title", text: event.title }));

				const details = el("ul", { className: "event-details" });
				details.appendChild(buildDetailItem("Date", formatDisplayDate(parseLocalDate(event.date))));

				if (event.time) {
					details.appendChild(buildDetailItem("Time", event.time));
				}

				if (event.location) {
					details.appendChild(buildDetailItem("Location", event.location));
				}

				if (event.course) {
					details.appendChild(buildDetailItem("Course", event.course));
				}

				content.appendChild(details);

				if (event.description) {
					content.appendChild(el("p", { className: "event-description", text: event.description }));
				}

				const registrationLink = getRegistrationLink(event);

				if (registrationLink) {
					const button = el("a", {
						className: "event-button",
						text: event.linkText || "Learn More",
						attrs: {
							href: registrationLink,
							target: "_blank",
							rel: "noopener noreferrer"
						}
					});
					button.appendChild(el("span", { className: "visually-hidden", text: " (opens in a new tab)" }));
					content.appendChild(button);
				}

				card.appendChild(content);
				return card;
			}

			function getUpcomingEvents(allEvents, today) {
				return allEvents
					.filter(event => event && event.title && event.date)
					.map(event => ({
						event,
						expirationDate: parseLocalDate(event.expires || event.date)
					}))
					.filter(({ expirationDate }) => expirationDate >= today)
					.sort((a, b) => parseLocalDate(a.event.date) - parseLocalDate(b.event.date))
					.map(({ event }) => event);
			}

			// Groups already-sorted events into consecutive runs by calendar
			// month, so the page can show a "September 2026" style heading
			// above each group without any month info being hand-maintained
			// in events.js.
			function groupByMonth(sortedEvents) {
				const groups = [];
				let currentKey = null;

				sortedEvents.forEach(event => {
					const date = parseLocalDate(event.date);
					const key = `${date.getFullYear()}-${date.getMonth()}`;

					if (key !== currentKey) {
						currentKey = key;
						groups.push({
							label: date.toLocaleDateString("en-US", { month: "long", year: "numeric" }),
							events: []
						});
					}

					groups[groups.length - 1].events.push(event);
				});

				return groups;
			}

			function renderEvents() {
				const today = getToday();

				if (typeof events === "undefined" || !Array.isArray(events)) {
					throw new Error("events.js did not define an `events` array.");
				}

				const upcomingEvents = getUpcomingEvents(events, today);

				if (upcomingEvents.length === 0) {
					eventsContainer.hidden = true;
					noEventsMessage.hidden = false;
					return;
				}

				const fragment = document.createDocumentFragment();

				groupByMonth(upcomingEvents).forEach(group => {
					fragment.appendChild(el("h2", { className: "month-heading", text: group.label }));
					group.events.forEach(event => fragment.appendChild(buildEventCard(event)));
				});

				eventsContainer.innerHTML = "";
				eventsContainer.appendChild(fragment);
				eventsContainer.hidden = false;
				noEventsMessage.hidden = true;
			}

			try {
				renderEvents();
			} catch (error) {
				console.error("Failed to render RIC events:", error);
				eventsContainer.hidden = true;
				noEventsMessage.hidden = true;
				loadErrorMessage.hidden = false;
			}
		})();
	</script>

</body>
</html>
